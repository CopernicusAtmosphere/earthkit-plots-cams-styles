name: Generate Style and Identity Files

on:
  push:
    paths:
      - 'config/styles.yml'
      - 'config/cads-definitions.yml'
  workflow_dispatch:

jobs:
  generate-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jinja2

      - name: Generate files
        run: |
          python .github/scripts/generate-earthkit-styles.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/cams/styles/* src/cams/identities/*
          git commit -m "Auto-generate style and identity files" || echo "No changes to commit"
          git push